[project]
name = "git-indexer"
version = "0.3.0"
description = "Index git commits for analysis"
authors = [{ name = "Li Lin", email = "guru.lin@gmail.com" }]
license = "MIT"
readme = "README.md"

requires-python = ">= 3.12"
dependencies = [
    "python-dotenv >= 1.0.1",
    "sqlalchemy >= 2.0.23",
    "psycopg[binary,pool] >= 3.1.14",
    "alembic >= 1.13.0",
    "tqdm >= 4.66.1",
    "loguru >= 0.7.2",
    "python-gitlab >= 4.2.0",
    "pygithub >= 2.1.1",
    "pydriller >= 2.6",
    "sqlalchemy-utils >= 0.41.1",
    "flask >= 2.3.3",
    "flask-wtf >= 1.2.1",
    "bootstrap-flask >= 2.3.3",
    "gunicorn >= 21.2.0",
]

[dependency-groups]
dev = [
    "pytest >= 8.3.0",
    "pytest-dotenv >= 0.5.2",
    "pytest-mock >= 3.14",
    "pytest-cov >= 6.0",
    "pre-commit >= 4.0.1",
    "ruff >= 0.9.6",
    "pyright>=1.1.399",
]


[tool.uv]
managed = true


[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
]

# see ruff configuration options at
# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
line-length = 90
indent-width = 4
exclude = [".git", "__pycache__", "venv", ".venv", "notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C",
    "I",
    "A",
] # Enable checks for PEP8, imports, and other standard rules
ignore = ["E203", "E266"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
env_files = [".env"]
